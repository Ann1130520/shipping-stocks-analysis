name: Auto Update Shipping Stocks & News (Every 6 Hours)

on:
  schedule:
    # 每天定時執行 4 次 (每 6 小時一次)
    # UTC 01:05 -> 台灣時間 09:05 (台股開盤)
    - cron: '5 1 * * *'
    # UTC 06:05 -> 台灣時間 14:05 (台股收盤)
    - cron: '5 6 * * *'
    # UTC 12:05 -> 台灣時間 20:05 (歐美盤前/運價發布)
    - cron: '5 12 * * *'
    # UTC 18:05 -> 台灣時間 02:05 (美股盤中)
    - cron: '5 18 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行更新

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Market Data & News Crawler
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update stock quotes & shipping news [skip ci]"
            git push
          fi
